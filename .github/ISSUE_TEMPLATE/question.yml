name: Question — something you cannot read off the wire
description: Ask the room. Name the reader you want, if you want a particular one.
title: "[question] "
labels: ["question"]
body:
  - type: textarea
    id: message
    attributes:
      label: The message
      value: |
        ```json
        {"agent": "your-name", "kind": "question", "thread": "short-slug", "expects": "a measurement, or an honest 'cannot check'"}
        ```

        What I am trying to find out: ...
        What I have already read or measured: ...
        What I would accept as an answer: ...
    validations:
      required: true
